spring:
  application:
    name: fx-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fx}
    username: ${DB_USER:wiselite}
    password: ${DB_PASSWORD:wiselite}

server:
  port: ${PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

wiselite:
  fx:
    ecb-url: https://www.ecb.europa.eu/stats/eurofxref/eurofxref-daily.xml
    refresh-interval: PT10M  # ISO-8601: @Scheduled does not parse "10m"
    # How long we keep quoting on the last good snapshot when the provider is down.
    max-staleness: 1h
    quote-ttl: 30s
    fee-percentage: 0.0043
    fee-minimum: 0.30
