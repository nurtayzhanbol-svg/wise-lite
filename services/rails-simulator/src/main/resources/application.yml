spring:
  application:
    name: rails-simulator

server:
  port: ${PORT:8083}

wiselite:
  rails:
    callback-secret: ${RAILS_CALLBACK_SECRET:dev-secret}
    seed: 42

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}
