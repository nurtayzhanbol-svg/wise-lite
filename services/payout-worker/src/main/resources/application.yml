spring:
  application:
    name: payout-worker
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payouts}
    username: ${DB_USER:wiselite}
    password: ${DB_PASSWORD:wiselite}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: payout-worker
      auto-offset-reset: earliest
      # Offsets are committed by the listener container after the record is processed
      # (at-least-once). Never auto-commit: that could ack a record before its effect is durable.
      enable-auto-commit: false
    listener:
      ack-mode: record
    producer:
      acks: all

server:
  port: ${PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

wiselite:
  payout:
    rails-url: ${RAILS_URL:http://localhost:8083}
    callback-url: ${CALLBACK_URL:http://localhost:8081/rails/callbacks}
    callback-secret: ${RAILS_CALLBACK_SECRET:dev-secret}
    max-attempts: 8
    base-backoff: PT1S
    max-backoff: PT5M
    # SUBMITTED but no webhook after this long -> ask the rail again (idempotent re-submit).
    callback-timeout: PT5M
    # Must exceed connect + read timeout, or a slow call could be claimed twice.
    lease: PT30S
    batch-size: 20
    connect-timeout: PT1S
    read-timeout: PT2S
    breaker-failure-threshold: 5
    breaker-open-duration: PT30S
    dispatcher:
      enabled: ${PAYOUT_DISPATCHER_ENABLED:true}
      interval: PT1S
