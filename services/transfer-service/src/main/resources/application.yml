spring:
  application:
    name: transfer-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/transfers}
    username: ${DB_USER:wiselite}
    password: ${DB_PASSWORD:wiselite}
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    # Dotted keys (relaxed binding) so they don't collide with the template/listener blocks below.
    # Observation = trace context propagated in Kafka headers, producer -> consumer.
    template.observation-enabled: true
    listener.observation-enabled: true
    consumer:
      group-id: transfer-service
      auto-offset-reset: earliest
      # Commit offsets only after the record is processed (at-least-once).
      enable-auto-commit: false
    listener:
      ack-mode: record
    producer:
      # acks=all + idempotence: a send that succeeds is on all in-sync replicas, and producer
      # retries never create duplicates or reorder records within a partition.
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 30000

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    tags:
      application: ${spring.application.name}

wiselite:
  outbox:
    relay:
      enabled: ${OUTBOX_RELAY_ENABLED:true}
      interval: PT0.2S  # ISO-8601: @Scheduled does not parse "200ms"
      batch-size: 100
  risk:
    # Fail closed: no decision within this time → HELD for a human (ADR 0017).
    decision-timeout: ${RISK_DECISION_TIMEOUT:PT5M}
    timeout-sweep:
      enabled: ${RISK_TIMEOUT_SWEEP_ENABLED:true}
      interval: PT5S
