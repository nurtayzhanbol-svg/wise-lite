global:
  scrape_interval: 5s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: wise-lite
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080 # transfer-service
          - host.docker.internal:8081 # payout-worker
          - host.docker.internal:8082 # fx-service
          - host.docker.internal:8083 # rails-simulator
          - host.docker.internal:8084 # reconciliation-job
